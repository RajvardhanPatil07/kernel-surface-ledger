name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: schema contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install "jsonschema==4.26.*" "PyYAML==6.*"
      - name: Validate schema contract
        run: python scripts/check_contract.py

  tests:
    name: engine + collector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install "jsonschema==4.26.*" "PyYAML==6.*"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-run collector on Linux runner
        run: |
          python -m collector.collect -o /tmp/raw.json
          python -c "
          import json
          raw = json.load(open('/tmp/raw.json'))
          assert raw['meta']['kernel_release'], 'missing kernel release'
          assert len(raw['modules_available']) > 100, 'modules.dep universe unexpectedly tiny'
          assert raw['workloads'], 'no workloads enumerated on a real host'
          print('collector smoke ok on', raw['meta']['distro'])
          "
