name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'report.schema.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build dashboard
        working-directory: web
        run: npm run build
      - name: Bundle latest runner report if present
        run: |
          mkdir -p web/dist/latest
          if [ -f data/reports/report.json ]; then
            cp data/reports/report.json web/dist/latest/report.json
            echo "bundled runner scan into /latest/"
          else
            echo "no runner scan yet — bundled fixture remains the default source"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
